name: Patch live pricing loader
on:
  push:
    paths:
      - pricing-live.js
      - scripts/patch_live_pricing.py
      - .github/workflows/patch-live-pricing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/patch_live_pricing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable live pricing on landing page"
          git push origin main
