name: Patch dynamic testimonials
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_dynamic_testimonials.py'
      - '.github/workflows/patch-dynamic-testimonials.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_dynamic_testimonials.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: show approved reviews on landing page'
          git push
