name: Patch TESTRA problem section

on:
  push:
    paths:
      - .github/workflows/patch-problem-section.yml
      - scripts/patch_problem_section.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch section
        run: python3 scripts/patch_problem_section.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No content changes to commit"
            exit 0
          fi
          git commit -m "Update TESTRA confidence signs section"
          git push origin main
