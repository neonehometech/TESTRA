name: Patch TESTRA ingredient images

on:
  push:
    paths:
      - .github/workflows/patch-ingredient-images.yml
      - scripts/patch_ingredient_images.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch ingredient cards
        run: python3 scripts/patch_ingredient_images.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No content changes to commit"
            exit 0
          fi
          git commit -m "Add botanical imagery to TESTRA ingredients"
          git push origin main
