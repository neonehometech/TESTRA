<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — TESTRA</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#1746ff;--n:#0a1128;--p:#f7f7fb;--i:#12142b;--m:#6b7091;--l:#e4e5f1;--ok:#1aa35a;--w:#d89a00;--e:#e0392b}*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;background:var(--p);color:var(--i)}h1,h2,h3{font-family:Fraunces,serif}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box,.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:20px}.box{width:min(360px,100%)}input,select,button,textarea{font:inherit}.fld{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;margin:6px 0 12px}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--b);color:#fff}.wa{background:#16a34a;color:#fff;text-decoration:none;text-align:center}.ghost{background:#fff;border:1px solid var(--l)}header{position:sticky;top:0;z-index:5;background:var(--n);color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center}.sp{flex:1}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px}.stat b{font-size:24px}.filters{display:flex;gap:8px;overflow:auto;margin:16px 0}.chip{white-space:nowrap;padding:8px 13px;border:1px solid var(--l);border-radius:999px;background:#fff;font-weight:700}.chip.on{background:var(--n);color:#fff}.order{background:#fff;border:1px solid var(--l);border-radius:14px;padding:15px;margin:9px 0;cursor:pointer}.r{display:flex;justify-content:space-between;gap:12px}.muted{color:var(--m);font-size:13px}.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#fff3d6;color:var(--w)}.detail{position:fixed;inset:0;background:var(--p);z-index:20;overflow:auto}.sec{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}.sec h3{font-size:12px;text-transform:uppercase;color:var(--b);letter-spacing:.05em}.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--p)}.actions{display:grid;gap:8px}.review{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}.stars{color:#ffb100}.err{color:var(--e);font-size:12px}.tabbar{display:flex;gap:8px;margin:12px 0}.tab{padding:9px 14px;border-radius:999px;border:1px solid var(--l);background:#fff;font-weight:800}.tab.on{background:var(--b);color:#fff}.demo{font-size:11px;background:#eef2ff;color:var(--b);padding:3px 8px;border-radius:999px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.r{align-items:flex-start}.wrap{padding:12px}.actions .btn{width:100%}}</style></head><body><div id="login" class="login"><div class="box"><h2>TESTRA Admin</h2><input id="em" class="fld" type="email" placeholder="Email"><input id="pw" class="fld" type="password" placeholder="Kata laluan"><button id="loginBtn" class="btn primary" style="width:100%">Log Masuk</button><div id="loginErr" class="err"></div></div></div><div id="app" class="hide"><header><b>TESTRA Admin</b><span class="sp"></span><small id="who"></small><button id="logout" class="btn ghost">Log Keluar</button></header><div class="wrap"><div class="tabbar"><button class="tab on" data-tab="orders">Pesanan</button><button class="tab" data-tab="reviews">Review</button></div><section id="ordersTab"><div class="stats"><div class="stat"><b id="stTotal">0</b><div class="muted">Jumlah</div></div><div class="stat"><b id="stPend">0</b><div class="muted">Belum sah</div></div><div class="stat"><b id="stShip">0</b><div class="muted">Dihantar</div></div></div><div class="filters" id="filters"></div><input id="search" class="fld" placeholder="Cari nama, telefon atau no. pesanan"><div id="orders"></div></section><section id="reviewsTab" class="hide"><div class="stats"><div class="stat"><b id="rvPend">0</b><div class="muted">Menunggu approval</div></div><div class="stat"><b id="rvPub">0</b><div class="muted">Published</div></div></div><div id="reviews"></div></section></div></div><div id="detail" class="detail hide"><header><button id="back" class="btn ghost">←</button><b id="ordNo"></b><span class="sp"></span></header><div class="wrap" style="max-width:680px"><div class="sec"><h3>Status</h3><select id="status" class="fld"><option value="pending_payment">Belum Disahkan</option><option value="paid">Dibayar</option><option value="processing">Diproses</option><option value="shipped">Dihantar</option><option value="out_for_delivery">Dalam Penghantaran</option><option value="delivered">Selesai</option><option value="cancelled">Dibatal</option><option value="refunded">Refund</option></select><button id="saveStatus" class="btn primary">Kemaskini Status</button></div><div class="sec"><h3>Pelanggan</h3><div id="cust"></div></div><div class="sec"><h3>Preset WhatsApp</h3><div class="actions"><a id="waReceived" class="btn wa" target="_blank">✓ Order diterima</a><a id="waShipped" class="btn wa" target="_blank">🚚 Produk dihantar</a><a id="waDelivered" class="btn wa" target="_blank">⭐ Delivered + minta review</a></div></div><div class="sec"><h3>Tracking / Courier</h3><input id="courier" class="fld" placeholder="Courier"><input id="awb" class="fld" placeholder="Tracking / AWB"><button id="saveTrack" class="btn primary">Simpan Tracking</button></div><div class="sec"><h3>Item</h3><div id="items"></div><div class="kv"><b>Jumlah</b><b id="total"></b></div></div><div class="sec"><h3>Timeline</h3><div id="timeline"></div></div></div></div><script>const U='https://aytmfuevvoumobwfqptc.supabase.co',K='sb_publishable_Uol-itavAcZy4ciP3gbqJg_Ea9sw1TS',sb=supabase.createClient(U,K),BASE='https://testra-eq2.pages.dev';let all=[],cur=null,filter='all';const RM=c=>'RM'+(c/100).toFixed(2),dt=x=>new Date(x).toLocaleString('ms-MY');const sm={pending_payment:'Belum Sah',paid:'Dibayar',processing:'Diproses',shipped:'Dihantar',out_for_delivery:'Dalam Penghantaran',delivered:'Selesai',cancelled:'Dibatal',refunded:'Refund'};function waNum(p){let n=(p||'').replace(/\D/g,'');if(n.startsWith('0'))n='6'+n;else if(!n.startsWith('60'))n='60'+n;return n}function walink(o,msg){return'https://wa.me/'+waNum(o.customer_phone)+'?text='+encodeURIComponent(msg)}async function session(){let{data:{session}}=await sb.auth.getSession();session?show(session):null}function show(s){login.classList.add('hide');app.classList.remove('hide');who.textContent=s.user.email;loadOrders();loadReviews()}loginBtn.onclick=async()=>{loginErr.textContent='';let{data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)return loginErr.textContent='Login gagal';show(data.session)};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};const statuses=['all','pending_payment','paid','processing','shipped','delivered','cancelled'];filters.innerHTML=statuses.map((s,i)=>`<button class="chip ${i?'':'on'}" data-s="${s}">${s==='all'?'Semua':sm[s]||s}</button>`).join('');filters.onclick=e=>{if(!e.target.dataset.s)return;[...filters.children].forEach(x=>x.classList.remove('on'));e.target.classList.add('on');filter=e.target.dataset.s;render()};search.oninput=render;async function loadOrders(){let{data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error)return console.error(error);all=data||[];stTotal.textContent=all.length;stPend.textContent=all.filter(x=>x.status==='pending_payment').length;stShip.textContent=all.filter(x=>['shipped','out_for_delivery','delivered'].includes(x.status)).length;render()}function render(){let q=search.value.toLowerCase(),arr=all.filter(o=>(filter==='all'||o.status===filter)&&(!q||[o.order_no,o.customer_name,o.customer_phone].join(' ').toLowerCase().includes(q)));orders.innerHTML=arr.map(o=>`<div class="order" data-id="${o.id}"><div class="r"><b>${o.order_no}</b><span class="badge">${sm[o.status]||o.status}</span></div><div class="muted">${o.customer_name} · ${o.customer_phone} ${o.source==='demo'?'<span class="demo">DEMO</span>':''}</div><div class="r"><span class="muted">${dt(o.created_at)}</span><b>${RM(o.total_cents)}</b></div></div>`).join('')||'<p class="muted">Tiada pesanan.</p>'}orders.onclick=e=>{let c=e.target.closest('.order');if(c)openOrder(all.find(x=>x.id===c.dataset.id))};async function openOrder(o){cur=o;detail.classList.remove('hide');ordNo.textContent=o.order_no;status.value=o.status;cust.innerHTML=`<div class="kv"><span>Nama</span><b>${o.customer_name}</b></div><div class="kv"><span>Telefon</span><b>${o.customer_phone}</b></div><div class="kv"><span>Email</span><b>${o.customer_email||'—'}</b></div>`;items.innerHTML=(o.order_items||[]).map(i=>`<div class="kv"><span>${i.product_name} × ${i.quantity}</span><b>${RM(i.line_total_cents)}</b></div>`).join('');total.textContent=RM(o.total_cents);let{data:s}=await sb.from('shipments').select('*').eq('order_id',o.id).order('created_at',{ascending:false}).limit(1);let sh=s&&s[0];courier.value=sh?.provider||'';awb.value=sh?.awb_number||'';const review=`${BASE}/review.html?order=${encodeURIComponent(o.id)}&name=${encodeURIComponent(o.customer_name)}`;waReceived.href=walink(o,`Hi ${o.customer_name}, terima kasih. Pesanan TESTRA anda (${o.order_no}) telah kami terima ✅\n\nJumlah: ${RM(o.total_cents)}\nStatus: Menunggu pengesahan/pembayaran.\n\nKami akan update anda bila pesanan diproses.`);waShipped.href=walink(o,`Hi ${o.customer_name}, pesanan TESTRA anda (${o.order_no}) telah dihantar 🚚\n\nCourier: ${courier.value||'akan dikemaskini'}\nTracking/AWB: ${awb.value||'akan dikemaskini'}\n\nTerima kasih kerana memilih TESTRA.`);waDelivered.href=walink(o,`Hi ${o.customer_name}, pesanan TESTRA anda (${o.order_no}) telah sampai ✅\n\nKami harap semuanya diterima dengan baik. Jika sudi, boleh beri review ringkas di sini:\n${review}\n\nReview akan dipaparkan selepas semakan admin. Terima kasih!`);let{data:ev}=await sb.from('order_events').select('*').eq('order_id',o.id).order('created_at',{ascending:false});timeline.innerHTML=(ev||[]).map(x=>`<div class="muted" style="margin:8px 0"><b>${x.description||x.event_type}</b><br>${dt(x.created_at)}</div>`).join('')||'—'}back.onclick=()=>detail.classList.add('hide');saveStatus.onclick=async()=>{let ns=status.value;let{error}=await sb.from('orders').update({status:ns}).eq('id',cur.id);if(error)return alert(error.message);await sb.from('order_events').insert({order_id:cur.id,event_type:'status_changed',description:'Status ditukar ke '+(sm[ns]||ns),actor:'admin'});cur.status=ns;await loadOrders();await openOrder(cur)};saveTrack.onclick=async()=>{let{data:e}=await sb.from('shipments').select('id').eq('order_id',cur.id).limit(1),obj={provider:courier.value||'manual',awb_number:awb.value,status:'pending'};let r=e?.length?await sb.from('shipments').update(obj).eq('id',e[0].id):await sb.from('shipments').insert({...obj,order_id:cur.id});if(r.error)return alert(r.error.message);await sb.from('order_events').insert({order_id:cur.id,event_type:'tracking_updated',description:`Tracking: ${awb.value||'—'} (${courier.value||'manual'})`,actor:'admin'});await openOrder(cur)};async function loadReviews(){let{data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});if(error)return console.error(error);let r=data||[];rvPend.textContent=r.filter(x=>!x.is_published).length;rvPub.textContent=r.filter(x=>x.is_published).length;reviews.innerHTML=r.map(x=>`<div class="review"><div class="r"><b>${x.customer_name}</b><span class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span></div><p>${x.comment||'—'}</p><div class="muted">${dt(x.created_at)}</div><div style="margin-top:10px"><button class="btn ${x.is_published?'ghost':'primary'}" data-pub="${x.id}" data-v="${x.is_published?'0':'1'}">${x.is_published?'Unpublish':'Approve & Publish'}</button><button class="btn ghost" data-del="${x.id}">Delete</button></div></div>`).join('')||'<p class="muted">Belum ada review.</p>'}reviews.onclick=async e=>{if(e.target.dataset.pub){await sb.from('reviews').update({is_published:e.target.dataset.v==='1'}).eq('id',e.target.dataset.pub);loadReviews()}if(e.target.dataset.del&&confirm('Delete review?')){await sb.from('reviews').delete().eq('id',e.target.dataset.del);loadReviews()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');ordersTab.classList.toggle('hide',b.dataset.tab!=='orders');reviewsTab.classList.toggle('hide',b.dataset.tab!=='reviews')});session();</script></body></html>
