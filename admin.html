<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TESTRA Admin</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071027}#adminFrame{border:0;width:100%;height:100%;display:block;background:#f4f5fb}</style></head><body><iframe id="adminFrame" title="TESTRA Admin"></iframe><script>(function(){const LANDING='https://testra-eq2.pages.dev/';const frame=document.getElementById('adminFrame');const ua=navigator.userAgent||'';const isTouchTablet=/Android|iPad|iPhone|Mobile|Tablet/i.test(ua)||((navigator.maxTouchPoints||0)>1&&/Macintosh/i.test(ua));const isDesktop=!isTouchTablet&&Math.max(screen.width,screen.height)>=1000;frame.src=isDesktop?'admin-desktop.html':'admin-core.html';frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const fontLink=d.createElement('link');fontLink.rel='stylesheet';fontLink.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap';d.head.appendChild(fontLink);const fontStyle=d.createElement('style');fontStyle.id='testra-modern-fonts';fontStyle.textContent='html,body,button,input,select,textarea{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}h1,h2,h3,h4,h5,h6,.brand b,.brandText b,.orderNo,.selectedTitle,.head b,.metric b,.stat b,.awbHead b,.loginCard h1,.box h2{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif!important;letter-spacing:-.025em}.brandMark,.loginMark,.mark{font-family:"Plus Jakarta Sans",Inter,sans-serif!important}.btn,.tab,.chip,.badge,.label{letter-spacing:-.01em}';d.head.appendChild(fontStyle);const addActions=()=>{if(d.getElementById('testraOpenPage'))return;const open=d.createElement('button'),share=d.createElement('button');open.id='testraOpenPage';share.id='testraSharePage';open.type=share.type='button';open.textContent=isDesktop?'Open Page ↗':'Page ↗';share.textContent='Share Page';open.title='Buka landing page TESTRA';share.title='Share landing page TESTRA';const target=isDesktop?d.querySelector('.nav'):d.querySelector('.tabbar');if(!target)return;const old=d.getElementById('navLanding');if(old)old.remove();open.className=isDesktop?'btn':'tab';share.className=isDesktop?'btn':'tab';open.onclick=()=>w.open(LANDING,'_blank','noopener');share.onclick=async()=>{try{if(navigator.share){await navigator.share({title:'TESTRA',text:'TESTRA — Keyakinan & Tenaga, Bila Anda Perlukan',url:LANDING})}else if(navigator.clipboard){await navigator.clipboard.writeText(LANDING);w.alert('Link landing page telah disalin.')}else{w.prompt('Copy link TESTRA:',LANDING)}}catch(e){if(e?.name!=='AbortError'){try{await navigator.clipboard.writeText(LANDING);w.alert('Link landing page telah disalin.')}catch(_){w.prompt('Copy link TESTRA:',LANDING)}}}};target.append(open,share)};addActions();new MutationObserver(addActions).observe(d.body,{childList:true,subtree:true});if(!isDesktop)return;const ws=d.querySelector('.workspace');if(!ws||d.getElementById('testra-resize-style'))return;const style=d.createElement('style');style.id='testra-resize-style';style.textContent='.workspace.testraResizable{grid-template-columns:var(--testra-c1,30%) 10px var(--testra-c2,38%) 10px var(--testra-c3,32%)!important;gap:0!important;padding:12px!important}.workspace.testraResizable>.col{margin:0 6px}.testraColResize{position:relative;cursor:col-resize;touch-action:none;z-index:20}.testraColResize:before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:4px;border-radius:999px;background:#d7dbea}.testraColResize:hover:before,.testraColResize.dragging:before{background:#1746ff;box-shadow:0 0 0 4px rgba(23,70,255,.10)}.testraColResize:after{content:"⋮";position:absolute;left:0;top:50%;transform:translateY(-50%);width:10px;text-align:center;color:#8790aa;font-weight:800}.col.testraRowResizable{gap:0!important}.testraRowResize{height:12px;min-height:12px;position:relative;cursor:row-resize;touch-action:none;z-index:25}.testraRowResize:before{content:"";position:absolute;left:12px;right:12px;top:4px;height:4px;border-radius:999px;background:#d7dbea}.testraRowResize:hover:before,.testraRowResize.dragging:before{background:#1746ff;box-shadow:0 0 0 4px rgba(23,70,255,.10)}.testraRowResize:after{content:"⋯";position:absolute;left:50%;top:-4px;transform:translateX(-50%);color:#8790aa;font-weight:800;font-size:16px}.col.testraRowResizable>.panel:first-child{flex:0 0 var(--testra-top-h,auto)!important}.col.testraRowResizable>.panel:last-child{flex:1 1 auto!important;min-height:0!important}';d.head.appendChild(style);ws.classList.add('testraResizable');const cols=[...ws.children].filter(x=>x.classList.contains('col'));if(cols.length!==3)return;const h1=d.createElement('div'),h2=d.createElement('div');h1.className=h2.className='testraColResize';h1.title=h2.title='Drag kiri/kanan untuk resize · Double click untuk reset';ws.insertBefore(h1,cols[1]);ws.insertBefore(h2,cols[2]);const KEY='testra_admin_column_widths_v1',MIN=[260,340,300];function apply(v,save=true){const total=ws.clientWidth-20;let a=[+v[0],+v[1],+v[2]],sum=a.reduce((s,x)=>s+x,0)||1;a=a.map(x=>x/sum*total).map((x,i)=>Math.max(MIN[i],x));let ex=a.reduce((s,x)=>s+x,0)-total;if(ex>0){for(const i of [1,2,0]){const room=a[i]-MIN[i],take=Math.min(room,ex);a[i]-=take;ex-=take;if(ex<=0)break}}ws.style.setProperty('--testra-c1',a[0]+'px');ws.style.setProperty('--testra-c2',a[1]+'px');ws.style.setProperty('--testra-c3',a[2]+'px');if(save)localStorage.setItem(KEY,JSON.stringify(a))}const current=()=>cols.map(c=>c.getBoundingClientRect().width);function reset(){localStorage.removeItem(KEY);apply([30,38,32],false)}let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}setTimeout(()=>saved?.length===3?apply(saved,false):reset(),0);function bind(handle,index){handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');const sx=e.clientX,start=current();const move=ev=>{const dx=ev.clientX-sx,n=[...start];if(index===0){n[0]=Math.max(MIN[0],start[0]+dx);n[1]=Math.max(MIN[1],start[1]-dx)}else{n[1]=Math.max(MIN[1],start[1]+dx);n[2]=Math.max(MIN[2],start[2]-dx)}apply(n,false)};const up=()=>{handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);localStorage.setItem(KEY,JSON.stringify(current()))};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up)});handle.addEventListener('dblclick',reset)}bind(h1,0);bind(h2,1);function setupRowResize(col,key,minTop,minBottom){const panels=[...col.children].filter(x=>x.classList.contains('panel'));if(panels.length<2)return;col.classList.add('testraRowResizable');const handle=d.createElement('div');handle.className='testraRowResize';handle.title='Drag atas/bawah untuk resize · Double click untuk reset';col.insertBefore(handle,panels[1]);const def=panels[0].getBoundingClientRect().height;const maxTop=()=>Math.max(minTop,col.clientHeight-minBottom-12);function setH(h,save=true){h=Math.max(minTop,Math.min(maxTop(),+h||def));col.style.setProperty('--testra-top-h',h+'px');if(save)localStorage.setItem(key,String(h))}setTimeout(()=>setH(+localStorage.getItem(key)||def,false),0);handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');const sy=e.clientY,sh=panels[0].getBoundingClientRect().height;const move=ev=>setH(sh+(ev.clientY-sy),false);const up=()=>{handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);localStorage.setItem(key,String(panels[0].getBoundingClientRect().height))};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up)});handle.addEventListener('dblclick',()=>{localStorage.removeItem(key);setH(def,false)})}setupRowResize(cols[0],'testra_admin_left_split_v1',120,220);setupRowResize(cols[2],'testra_admin_right_split_v1',210,220);w.addEventListener('resize',()=>{let v;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(v)apply(v,false)})}catch(e){console.error('TESTRA admin enhancement init failed',e)}})})();</script></body></html>
