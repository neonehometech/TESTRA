.wsCol{min-width:0;height:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden}.wsPanel{background:rgba(255,255,255,.97);border:1px solid var(--wsLine);border-radius:22px;box-shadow:var(--wsSoft);min-height:0}.wsHead{padding:15px 17px;border-bottom:1px solid #eef0f6;display:flex;align-items:center;gap:9px}.wsHead b{font-family:Fraunces,serif;font-size:16px;color:#0a1128}.wsHead small{color:#727791}.wsBody{padding:15px 17px}.wsScroll{overflow:auto;scrollbar-width:thin}.wsFill{flex:1;min-height:0}.wsSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wsMetric{padding:13px;border-radius:16px;background:linear-gradient(145deg,#fff,#f8f9ff);border:1px solid #e6e8f2;position:relative;overflow:hidden}.wsMetric:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#ffb100,#ff5a1f)}.wsMetric b{display:block;font:700 25px Fraunces;color:#0a1128}.wsMetric span{font-size:10px;color:#747a94}.wsEmpty{padding:26px 16px;text-align:center;color:#7a8098;font-size:12px}.wsOrderTitle{font:700 22px Fraunces;color:#0a1128;margin:2px 0 7px}.wsSection{padding:13px 0;border-bottom:1px solid #eff0f5}.wsSection:last-child{border-bottom:0}.wsLabel{display:block;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:#1746ff;font-weight:800;margin-bottom:8px}.wsKV{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:4px 0}.wsKV span{color:#777d95}.wsKV b{text-align:right}.wsActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.wsActions .btn{padding:8px 10px;font-size:10px;min-height:36px}.wsStatusRow{display:grid;grid-template-columns:1fr auto;gap:7px}.wsStatusRow .fld{margin:0!important;min-height:38px!important;padding:8px 10px!important}.wsGate{font-size:10px;line-height:1.45;padding:9px 10px;border-radius:11px;background:#fff8e7;color:#836000;border:1px solid #f1dfa9}.wsGate.ok{background:#eaf8f0;color:#0f7442;border-color:#cbe9d7}.wsCenterTop{padding:14px 15px 10px}.wsToolbar{display:flex;gap:7px;align-items:center}.wsToolbar .fld{margin:0!important;min-height:40px!important}.wsToolbar .btn{white-space:nowrap;padding:8px 11px;font-size:10px}.wsFilters{display:flex;gap:6px;overflow:auto;padding:10px 0 2px}.wsChip{white-space:nowrap;border:1px solid #e1e3ed;background:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;color:#747a94;cursor:pointer}.wsChip.on{background:#0a1128;color:#fff;border-color:#0a1128}.wsOrders{padding:0 12px 14px}.wsOrders .order{margin:9px 0!important;padding:14px!important;border-radius:17px!important;box-shadow:0 5px 18px rgba(10,17,40,.045)!important}.wsOrders .orderTop{gap:8px}.wsOrders .orderNo{font-size:15px}.wsOrders .amount{font-size:14px}.wsOrders .muted{font-size:10px}.wsOrders .badge{font-size:8px;padding:4px 6px}.wsOrders .badges{margin-top:8px;gap:4px}.awbPreview{background:#fff;border:1px solid #dfe2ec;border-radius:15px;padding:14px;box-shadow:inset 0 0 0 1px #fff}.awbBrand{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0a1128;padding-bottom:8px;margin-bottom:9px}.awbBrand b{font:700 19px Fraunces}.awbBrand span{font-size:8px;letter-spacing:.13em;color:#737990}.awbNo{font:800 20px Manrope;margin:6px 0}.awbTrack{background:#f0f2f7;border-radius:9px;padding:8px;font-size:11px;margin:7px 0}.awbTo{margin-top:10px;font-size:10px;line-height:1.45}.awbTo b{display:block;font-size:13px;color:#0a1128}.awbDemo{margin-top:10px;border:1px dashed #d43d32;color:#d43d32;border-radius:8px;padding:6px;text-align:center;font-size:9px;font-weight:800}.wsPrint{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.wsPrint .btn{font-size:9px;padding:8px}.presetCard{border:1px solid #e7e9f1;border-radius:14px;padding:11px;margin:8px 0;background:#fbfcff}.presetTop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.presetTop b{font-size:10px;color:#0a1128}.presetState{font-size:8px;font-weight:800;padding:3px 6px;border-radius:999px;background:#fff0ef;color:#d43d32}.presetState.done{background:#e9f8f0;color:#107342}.presetText{font-size:9.5px;line-height:1.5;color:#656b84;white-space:pre-wrap;max-height:76px;overflow:auto;background:#f5f6fa;border-radius:9px;padding:8px}.presetCard .btn{width:100%;margin-top:7px;padding:8px;font-size:9px}.wsTimeline{font-size:9.5px}.wsTimeline>div{padding:7px 0;border-bottom:1px solid #f0f1f5;color:#737990}.wsTimeline b{display:block;color:#1a1e34;margin-bottom:2px}

const workstationScript=`
(()=>{
 const isTablet=()=>{const ua=navigator.userAgent||'';return /Android|iPad|Tablet|Silk|Kindle/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)};

 let wsFilter='all',wsQuery='',selectedId=null;
 const app=document.getElementById('app');if(!app||document.getElementById('desktopWS'))return;
 const ws=document.createElement('div');ws.id='desktopWS';
 ws.innerHTML=\`<div class="wsCol"><div class="wsPanel"><div class="wsHead"><b>Order Summary</b></div><div class="wsBody"><div class="wsSummary"><div class="wsMetric"><b id="wsTotal">0</b><span>Jumlah</span></div><div class="wsMetric"><b id="wsPending">0</b><span>Belum bayar</span></div><div class="wsMetric"><b id="wsShipping">0</b><span>Penghantaran</span></div></div></div></div><div class="wsPanel wsFill wsScroll"><div class="wsHead"><b>Order Details</b><small id="wsSelectedNo">Pilih order</small></div><div id="wsDetail" class="wsBody"><div class="wsEmpty">Klik order di column tengah untuk lihat maklumat pelanggan dan tindakan order.</div></div></div></div><div class="wsCol"><div class="wsPanel wsFill"><div class="wsHead"><b>Order Queue</b><span class="sp"></span><small id="wsCount"></small></div><div class="wsCenterTop"><div class="wsToolbar"><input id="wsSearch" class="fld" placeholder="Cari nama / telefon / order"><button id="wsPrintAll" class="btn primary">Print AWB</button></div><div id="wsFilters" class="wsFilters"></div></div><div id="wsOrders" class="wsOrders wsScroll" style="height:calc(100% - 116px)"></div></div></div><div class="wsCol"><div class="wsPanel"><div class="wsHead"><b>AWB Preview</b><span class="sp"></span><small>Print layout</small></div><div id="wsAwb" class="wsBody"><div class="wsEmpty">Pilih order untuk preview AWB.</div></div></div><div class="wsPanel wsFill wsScroll"><div class="wsHead"><b>WhatsApp Preset</b><span class="sp"></span><small>Lifecycle</small></div><div id="wsWA" class="wsBody"><div class="wsEmpty">Preset mesej akan muncul selepas order dipilih.</div></div></div></div>\`;
 app.appendChild(ws);
 const statuses=['all','pending_payment','processing','shipped','out_for_delivery','delivered','cancelled'];const label=s=>s==='all'?'Semua':(sm[s]||s);wsFilters.innerHTML=statuses.map((s,i)=>\`<button class="wsChip \\${i?'':'on'}" data-s="\\${s}">\\${label(s)}</button>\`).join('');wsFilters.onclick=e=>{if(!e.target.dataset.s)return;wsFilter=e.target.dataset.s;[...wsFilters.children].forEach(x=>x.classList.toggle('on',x.dataset.s===wsFilter));renderList()};wsSearch.oninput=e=>{wsQuery=e.target.value.toLowerCase();renderList()};wsPrintAll.onclick=()=>printOrders(all.filter(o=>{let f=flags(o);return f.paid&&f.awb&&!f.printed}));
 function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}
 function renderSummary(){if(!desktop())return;wsTotal.textContent=all.length;wsPending.textContent=all.filter(x=>x.payment_status!=='paid').length;wsShipping.textContent=all.filter(x=>['shipped','out_for_delivery'].includes(x.status)).length}
 function renderList(){if(!desktop())return;let arr=all.filter(o=>(wsFilter==='all'||o.status===wsFilter)&&(!wsQuery||[o.order_no,o.customer_name,o.customer_phone].join(' ').toLowerCase().includes(wsQuery)));wsCount.textContent=arr.length+' order';wsOrders.innerHTML=arr.map(o=>\`<div class="order \\${o.id===selectedId?'wsSelected':''}" data-id="\\${o.id}"><div class="orderTop"><div><div class="orderNo">\\${esc(o.order_no)}</div><div class="muted">\\${esc(o.customer_name)} · \\${esc(o.customer_phone)} \\${o.source==='demo'?'<span class="demo">DEMO</span>':''}</div></div><div class="amount">\\${RM(o.total_cents)}</div></div><div class="badges">\\${badges(o)}</div></div>\`).join('')||'<div class="wsEmpty">Tiada order.</div>'}
 wsOrders.onclick=async e=>{let c=e.target.closest('.order');if(!c)return;let o=all.find(x=>x.id===c.dataset.id);if(!o)return;selectedId=o.id;await openOrder(o);renderList();renderSelected()};
 function address(o){let a=o.shipping_address||{};return [a.line1,a.line2,[a.postcode,a.city].filter(Boolean).join(' '),a.state].filter(Boolean).join('<br>')||'—'}function current(){return all.find(x=>x.id===selectedId)||cur}
 function renderSelected(){if(!desktop())return;let o=current();if(!o)return;let f=flags(o),sh=shFor(o.id),ev=events.filter(x=>x.order_id===o.id),ng=nextGate(o);wsSelectedNo.textContent=o.order_no;wsDetail.innerHTML=\`<div class="wsOrderTitle">\\${esc(o.order_no)}</div><div class="badges">\\${badges(o)}</div><div class="wsSection"><span class="wsLabel">Customer</span><div class="wsKV"><span>Nama</span><b>\\${esc(o.customer_name)}</b></div><div class="wsKV"><span>Telefon</span><b>\\${esc(o.customer_phone)}</b></div><div class="wsKV"><span>Email</span><b>\\${esc(o.customer_email||'—')}</b></div><div class="wsKV"><span>Alamat</span><b style="max-width:60%">\\${address(o)}</b></div></div><div class="wsSection"><span class="wsLabel">Payment & Status</span><div class="wsKV"><span>Payment</span><b>\\${f.paid?'PAID / CONFIRMED':'UNPAID'}</b></div><div class="wsKV"><span>Jumlah</span><b>\\${RM(o.total_cents)}</b></div><div class="wsStatusRow"><select id="wsStatus" class="fld">\\${['pending_payment','processing','shipped','out_for_delivery','delivered','cancelled','refunded'].map(s=>\`<option value="\\${s}" \\${o.status===s?'selected':''}>\\${sm[s]||s}</option>\`).join('')}</select><button id="wsSaveStatus" class="btn primary">Update</button></div><div class="wsActions"><button id="wsPay" class="btn primary" \\${f.paid?'disabled':''}>Confirm Payment</button><button id="wsTrack" class="btn ghost">Edit Tracking</button></div></div><div class="wsSection"><span class="wsLabel">Progress Gate</span><div class="wsGate \\${ng.ok?'ok':''}">\\${esc(ng.msg)}</div></div><div class="wsSection"><span class="wsLabel">Items</span>\\${(o.order_items||[]).map(i=>\`<div class="wsKV"><span>\\${esc(i.product_name)} × \\${i.quantity}</span><b>\\${RM(i.line_total_cents)}</b></div>\`).join('')}</div><div class="wsSection"><span class="wsLabel">Timeline</span><div class="wsTimeline">\\${ev.slice(0,8).map(x=>\`<div><b>\\${esc(x.description||x.event_type)}</b>\\${dt(x.created_at)}</div>\`).join('')||'—'}</div></div>\`;wsStatus.onchange=()=>status.value=wsStatus.value;wsSaveStatus.onclick=()=>{status.value=wsStatus.value;saveStatus.click()};wsPay.onclick=()=>confirmPay.click();wsTrack.onclick=()=>{document.body.classList.remove('ws-desktop');document.getElementById('detail').classList.remove('hide');setTimeout(()=>{courier.focus();},50)};renderAwb(o,sh,f);renderWA(o,sh,f)}
 function renderAwb(o,sh,f){wsAwb.innerHTML=\`<div class="awbPreview"><div class="awbBrand"><b>TESTRA</b><span>FULFILMENT LABEL</span></div><div class="awbNo">\\${esc(o.order_no)}</div><div class="awbTrack">\\${esc(sh?.provider||'Courier belum dipilih')} · <b>\\${esc(sh?.awb_number||'NO AWB')}</b></div><div class="awbTo"><span class="wsLabel">SHIP TO</span><b>\\${esc(o.customer_name)}</b><div>\\${esc(o.customer_phone)}</div><div>\\${address(o)}</div></div><div class="wsKV" style="margin-top:9px"><span>Total</span><b>\\${RM(o.total_cents)} · \\${f.paid?'PAID':'UNPAID'}</b></div>\\${o.source==='demo'?'<div class="awbDemo">TEST / DEMO LABEL</div>':''}</div><div class="wsPrint"><button id="wsPrintOne" class="btn primary" \\${!(f.paid&&f.awb)?'disabled':''}>Print AWB</button><button id="wsEditAwb" class="btn ghost">Edit AWB</button></div>\`;wsPrintOne.onclick=()=>printOrders([o]);wsEditAwb.onclick=()=>{document.body.classList.remove('ws-desktop');document.getElementById('detail').classList.remove('hide');setTimeout(()=>awb.focus(),50)}}
 function messages(o,sh){let review=BASE+'/review.html?order='+encodeURIComponent(o.id)+'&name='+encodeURIComponent(o.customer_name);return{received:\`Hi \\${o.customer_name}, terima kasih. Pesanan TESTRA anda (\\${o.order_no}) telah kami terima ✅\\n\\nJumlah: \\${RM(o.total_cents)}\\nStatus: Menunggu pengesahan pembayaran.\`,paid:\`Hi \\${o.customer_name} 👋\\n\\nPembayaran untuk pesanan TESTRA \\${o.order_no} telah disahkan ✅\\n\\nCourier: \\${sh?.provider||'—'}\\nTracking/AWB: \\${sh?.awb_number||'—'}\`,shipped:\`Hi \\${o.customer_name}, pesanan TESTRA anda (\\${o.order_no}) telah SHIP OUT 🚚\\n\\nCourier: \\${sh?.provider||'—'}\\nTracking/AWB: \\${sh?.awb_number||'—'}\`,delivered:\`Hi \\${o.customer_name}, pesanan TESTRA anda (\\${o.order_no}) telah sampai ✅\\n\\nJika sudi, beri review di sini:\\n\\${review}\`}}
 function renderWA(o,sh,f){let m=messages(o,sh),cards=[['Order Received','received','whatsapp_order_received',f.received,false],['Payment Confirmed + Tracking','paid','whatsapp_payment_confirmed',f.paywa,!(f.paid&&f.awb)],['Ship Out + Tracking','shipped','whatsapp_shipped',f.shipwa,!f.awb],['Delivered + Review','delivered','whatsapp_delivered_review',f.reviewwa,false]];wsWA.innerHTML=cards.map(c=>\`<div class="presetCard"><div class="presetTop"><b>\\${c[0]}</b><span class="presetState \\${c[3]?'done':''}">\\${c[3]?'SENT':'PENDING'}</span></div><div class="presetText">\\${esc(m[c[1]])}</div><button class="btn wa" data-wa="\\${c[2]}" \\${c[4]?'disabled':''}>Open WhatsApp</button></div>\`).join('');wsWA.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa))}
 const oldLoad=loadOrders;loadOrders=async function(...a){let r=await oldLoad(...a);applyMode();renderSummary();renderList();if(selectedId)renderSelected();return r};const oldOpen=openOrder;openOrder=async function(o){let r=await oldOpen(o);selectedId=o.id;if(desktop()){detail.classList.add('hide');renderList();renderSelected()}return r};
 const init=()=>{applyMode();if(!app.classList.contains('hide')&&desktop()){renderSummary();renderList();if(!selectedId&&all.length){selectedId=all[0].id;openOrder(all[0])}}};const mo=new MutationObserver(init);mo.observe(app,{attributes:true,attributeFilter:['class']});addEventListener('resize',()=>{applyMode();if(desktop()){renderSummary();renderList();if(selectedId)renderSelected()}});setTimeout(init,500);
})();`;
const frame=document.getElementById('adminFrame');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;const s=d.createElement('style');s.textContent=premium;d.head.appendChild(s);const js=d.createElement('script');js.textContent=workstationScript;d.body.appendChild(js)}catch(e){console.error(e)}});
