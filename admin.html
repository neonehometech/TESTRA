<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TESTRA Admin</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071027}#adminFrame{border:0;width:100%;height:100%;display:block;background:#f4f5fb}</style></head><body><iframe id="adminFrame" title="TESTRA Admin"></iframe><script>(function(){const frame=document.getElementById('adminFrame');const ua=navigator.userAgent||'';const isTouchTablet=/Android|iPad|iPhone|Mobile|Tablet/i.test(ua)||((navigator.maxTouchPoints||0)>1&&/Macintosh/i.test(ua));const isDesktop=!isTouchTablet&&Math.max(screen.width,screen.height)>=1000;frame.src=isDesktop?'admin-desktop.html':'admin-core.html';if(!isDesktop)return;frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow,ws=d.querySelector('.workspace');if(!ws||d.getElementById('testra-resize-style'))return;const style=d.createElement('style');style.id='testra-resize-style';style.textContent='.workspace.testraResizable{grid-template-columns:var(--testra-c1,30%) 10px var(--testra-c2,38%) 10px var(--testra-c3,32%)!important;gap:0!important;padding:12px!important}.workspace.testraResizable>.col{margin:0 6px}.testraColResize{position:relative;cursor:col-resize;touch-action:none;z-index:20}.testraColResize:before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:4px;border-radius:999px;background:#d7dbea;transition:.15s}.testraColResize:hover:before,.testraColResize.dragging:before{background:#1746ff;box-shadow:0 0 0 4px rgba(23,70,255,.10)}.testraColResize:after{content:"⋮";position:absolute;left:0;top:50%;transform:translateY(-50%);width:10px;text-align:center;color:#8790aa;font-weight:800;font-size:15px}.testraColResize:hover:after,.testraColResize.dragging:after{color:#1746ff}';d.head.appendChild(style);ws.classList.add('testraResizable');const cols=[...ws.children].filter(x=>x.classList.contains('col'));if(cols.length!==3)return;const h1=d.createElement('div'),h2=d.createElement('div');h1.className=h2.className='testraColResize';h1.title=h2.title='Drag untuk resize · Double click untuk reset';ws.insertBefore(h1,cols[1]);ws.insertBefore(h2,cols[2]);const KEY='testra_admin_column_widths_v1';const MIN=[260,340,300];function apply(v,save=true){const total=ws.clientWidth-20;let a=[Number(v[0]),Number(v[1]),Number(v[2])];const sum=a[0]+a[1]+a[2]||1;a=a.map(x=>x/sum*total);for(let i=0;i<3;i++)a[i]=Math.max(MIN[i],a[i]);const excess=a.reduce((s,x)=>s+x,0)-total;if(excess>0){let idx=a[1]-MIN[1]>=excess?1:(a[2]-MIN[2]>=excess?2:0);a[idx]-=excess}ws.style.setProperty('--testra-c1',a[0]+'px');ws.style.setProperty('--testra-c2',a[1]+'px');ws.style.setProperty('--testra-c3',a[2]+'px');if(save)localStorage.setItem(KEY,JSON.stringify(a));}function current(){return[cols[0].getBoundingClientRect().width,cols[1].getBoundingClientRect().width,cols[2].getBoundingClientRect().width]}function reset(){localStorage.removeItem(KEY);apply([30,38,32],false)}let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}setTimeout(()=>saved&&saved.length===3?apply(saved,false):reset(),0);function bind(handle,index){handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');const startX=e.clientX,start=current();const move=ev=>{const dx=ev.clientX-startX;let next=[...start];if(index===0){next[0]=Math.max(MIN[0],start[0]+dx);next[1]=Math.max(MIN[1],start[1]-dx)}else{next[1]=Math.max(MIN[1],start[1]+dx);next[2]=Math.max(MIN[2],start[2]-dx)}apply(next,false)};const up=()=>{handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);localStorage.setItem(KEY,JSON.stringify(current()))};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up)});handle.addEventListener('dblclick',reset)}bind(h1,0);bind(h2,1);w.addEventListener('resize',()=>{let v;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(v)apply(v,false)});}catch(e){console.error('TESTRA workstation resize init failed',e)}});})();</script></body></html>
