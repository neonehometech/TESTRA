<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TESTRA Admin</title><style>:root{--nav-h:70px;--top-h:0px;--util-h:44px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071027;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#adminFrame{border:0;width:100%;height:calc(100% - var(--nav-h) - var(--util-h));display:block;background:#f4f5fb}.desktopTop{display:none}.mobileUtility{height:var(--util-h);display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:5px 10px;background:linear-gradient(110deg,#071027,#0a1128 58%,#1636b6 130%);border-bottom:1px solid rgba(255,255,255,.09)}.utilityAction,.navItem,.topAction{appearance:none;border:0;font-family:inherit;font-weight:800;cursor:pointer}.utilityAction{height:32px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-size:9px;display:flex;align-items:center;gap:6px}.utilityAction.primary{background:#fff;color:#071027}.adminNav{height:var(--nav-h);display:flex;align-items:center;justify-content:space-around;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(110deg,#071027,#0a1128 58%,#1636b6 130%);border-top:1px solid rgba(255,255,255,.1)}.navItem,.topAction{background:transparent;color:rgba(255,255,255,.62);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px}.navItem{min-width:0;flex:1;height:52px;flex-direction:column;font-size:8px}.navItem svg,.topAction svg,.utilityAction svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.navItem.active{color:#fff;background:rgba(255,255,255,.12)}@media(min-width:900px){:root{--nav-h:0px;--top-h:62px;--util-h:0px}.mobileUtility{display:none}.desktopTop{height:var(--top-h);display:flex;align-items:center;padding:0 18px;background:linear-gradient(110deg,#071027,#0a1128 58%,#1636b6 130%);color:#fff}.brand{display:flex;align-items:center;gap:10px;margin-right:24px}.brandMark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffb100,#ff5a1f);display:grid;place-items:center;color:#071027;font-weight:950}.brandText b{display:block;font-size:13px}.brandText small{display:block;font-size:8px;opacity:.48}.desktopNav{display:flex;align-items:center;gap:4px;height:100%;flex:1}.desktopNav .navItem{height:42px;min-width:auto;flex:0 0 auto;padding:0 11px;flex-direction:row;font-size:10px}.desktopActions{display:flex;gap:7px}.topAction{height:38px;padding:0 12px;font-size:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07)}.topAction.primary{background:#fff;color:#071027}.adminNav{display:none}#adminFrame{height:calc(100% - var(--top-h))}}</style></head><body><header class="desktopTop"><div class="brand"><div class="brandMark">T</div><div class="brandText"><b>TESTRA Admin</b><small>BUSINESS COMMAND CENTER</small></div></div><nav class="desktopNav"><button class="navItem active" data-page="orders">Orders</button><button class="navItem" data-page="inventory">Inventory</button><button class="navItem" data-page="pricing">Pricing</button><button class="navItem" data-page="content">Content</button><button class="navItem" data-page="sales">Sales</button></nav><div class="desktopActions"><button class="topAction shareAction">Share</button><button class="topAction primary openAction">Landing Page</button></div></header><div class="mobileUtility"><button class="utilityAction shareAction">Share</button><button class="utilityAction primary openAction">Open Page</button></div><iframe id="adminFrame" title="TESTRA Admin"></iframe><nav class="adminNav"><button class="navItem active" data-page="orders">Orders</button><button class="navItem" data-page="inventory">Inventory</button><button class="navItem" data-page="pricing">Pricing</button><button class="navItem" data-page="content">Content</button><button class="navItem" data-page="sales">Sales</button></nav><script>const f=document.getElementById('adminFrame'),buttons=[...document.querySelectorAll('.navItem')];function isDesktop(){return matchMedia('(min-width:900px)').matches}function adminSrc(){const ua=navigator.userAgent||'',touch=/Android|iPad|iPhone|Mobile|Tablet/i.test(ua)||((navigator.maxTouchPoints||0)>1&&/Macintosh/i.test(ua));return !touch&&Math.max(screen.width,screen.height)>=1000?'admin-desktop.html':'admin-core.html'}function go(page){buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='inventory')f.src='inventory-mockup.html';else if(page==='pricing')f.src='pricing-settings.html';else if(page==='content')f.src='content-center-mockup.html';else if(page==='sales')f.src='sales-overview-mockup.html';else f.src=adminSrc()}buttons.forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));f.addEventListener('load',()=>{if(!isDesktop())return;try{const d=f.contentDocument;if(!d||d.getElementById('testra-single-topbar'))return;const s=d.createElement('style');s.id='testra-single-topbar';s.textContent='.top{display:none!important}.workspace{height:100vh!important}.reviewPage{height:100vh!important}body>.top{display:none!important}';d.head.appendChild(s)}catch(e){}});go('orders');const landing=new URL('./',location.href).href;document.querySelectorAll('.openAction').forEach(b=>b.onclick=()=>window.open(landing,'_blank','noopener'));document.querySelectorAll('.shareAction').forEach(b=>b.onclick=async()=>{try{if(navigator.share)await navigator.share({title:'TESTRA',url:landing});else if(navigator.clipboard){await navigator.clipboard.writeText(landing);alert('Landing page link copied.')}else prompt('Copy landing page link:',landing)}catch(e){}});</script><script src="admin-delete-order.js"></script><script src="admin-review-images.js"></script></body></html>
