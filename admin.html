if;font-size:21px;letter-spacing:-.01em}header small{color:rgba(255,255,255,.72);max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header .ghost{color:#0a1128!important}.wrap{max-width:1080px!important;padding:24px 18px 80px!important}.tabbar{display:inline-flex!important;padding:5px!important;border-radius:999px!important;background:rgba(255,255,255,.78)!important;border:1px solid rgba(228,229,241,.9)!important;box-shadow:var(--soft)!important;backdrop-filter:blur(14px);margin:8px 0 22px!important}.tab{border:0!important;background:transparent!important;padding:10px 18px!important}.tab.on{background:linear-gradient(135deg,#1746ff,#0f30c4)!important;color:#fff!important;box-shadow:0 7px 18px rgba(23,70,255,.22)}.stats{gap:14px!important}.stat{padding:20px!important;border-radius:22px!important;background:linear-gradient(145deg,#fff,#fafaff)!important;border:1px solid rgba(226,228,240,.9)!important;box-shadow:var(--soft)!important;position:relative;overflow:hidden}.stat:after{content:'';position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgba(255,177,0,.14),rgba(255,90,31,.10))}.stat b{font-family:Fraunces,serif;font-size:32px!important;color:#0a1128}.toolbar{margin:20px 0 12px!important}.filters{padding:4px 1px 8px;margin:12px 0!important}.chip{padding:10px 15px!important;border-color:#e1e3ed!important;background:rgba(255,255,255,.88)!important;box-shadow:0 3px 12px rgba(10,17,40,.04)}.chip.on{background:#0a1128!important;color:#fff!important;border-color:#0a1128!important}.order{padding:19px!important;margin:12px 0!important;border-radius:22px!important;border:1px solid rgba(225,227,239,.95)!important;background:rgba(255,255,255,.96)!important;box-shadow:var(--soft)!important;transition:.18s ease}.order:hover{transform:translateY(-2px);box-shadow:var(--shadow)!important;border-color:rgba(23,70,255,.22)!important}.order>.r:first-child b:first-child{font-family:Fraunces,serif;font-size:19px}.order>.r:first-child b:last-child{font-size:18px;color:#0a1128}.badges{gap:7px!important;margin-top:12px!important}.badge{padding:5px 9px!important;border-radius:999px!important;letter-spacing:.02em;border:1px solid transparent}.badge.ok{background:#eaf8f0!important;border-color:#cfefdc}.badge.no{background:#fff1ef!important;border-color:#ffd9d4}.badge.info{background:#edf1ff!important;border-color:#dce4ff}.demo{border:1px solid #dce4ff}.listActions{margin-top:13px!important}.mini{border-radius:12px!important}.detail{background:radial-gradient(circle at 80% 0,rgba(23,70,255,.08),transparent 30%),#f5f6fb!important}.detail>.wrap{max-width:760px!important}.sec{padding:20px!important;margin:14px 0!important;border-radius:22px!important;border:1px solid rgba(225,227,239,.95)!important;background:rgba(255,255,255,.97)!important;box-shadow:var(--soft)!important}.sec h3{font-family:Manrope,sans-serif!important;font-weight:800!important;font-size:11px!important;letter-spacing:.11em!important;margin:0 0 14px!important;color:#1746ff!important}.kv{padding:9px 0!important;border-bottom:1px solid #f0f1f6!important}.actions{gap:10px!important}.gate{padding:13px 14px!important;border-radius:14px!important;border:1px solid #f7dfaa;background:#fff9e9!important}.gate.ok{border-color:#cdebd8;background:#edfaf2!important}.review{padding:20px!important;margin:12px 0!important;border-radius:22px!important;background:#fff!important;border:1px solid #e3e5ef!important;box-shadow:var(--soft)!important}.review p{line-height:1.65}.stars{font-size:17px;letter-spacing:1px}.muted{line-height:1.5}.err{margin-top:10px}.detail #timeline .muted{padding:11px 0!important;margin:0!important;border-bottom:1px solid #f0f1f6}.detail #timeline .muted b{color:#12142b}.detail #total{font-size:19px;color:#1746ff}
