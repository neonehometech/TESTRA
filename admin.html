<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TESTRA Admin</title><style>:root{--nav-h:72px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071027;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#adminFrame{border:0;width:100%;height:calc(100% - var(--nav-h));display:block;background:#f4f5fb}.adminNav{height:var(--nav-h);display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(110deg,#071027,#0a1128 58%,#1636b6 130%);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 30px rgba(7,16,39,.16)}.navItem{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.58);min-width:88px;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:800;cursor:pointer}.navItem svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.navItem.active{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.navItem.soon{opacity:.42;cursor:default}.soonDot{font-size:7px;padding:2px 5px;border-radius:99px;background:#ffb100;color:#071027;margin-left:3px}@media(max-width:520px){:root{--nav-h:70px}.adminNav{justify-content:space-around;padding-left:5px;padding-right:5px}.navItem{min-width:0;flex:1;font-size:9px;border-radius:14px}}</style></head><body><iframe id="adminFrame" title="TESTRA Admin"></iframe><nav class="adminNav" aria-label="Admin navigation"><button class="navItem active" data-page="orders" aria-label="Order System"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v14H4V7l2-4Z"/><path d="M4 7h16M9 11h6"/></svg><span>Orders</span></button><button class="navItem" data-page="inventory" aria-label="Inventory"><svg viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="m3 7 9 4 9-4v10l-9 4-9-4V7Z"/><path d="M12 11v10"/></svg><span>Inventory</span></button><button class="navItem soon" data-page="sales" aria-label="Sales Overview coming soon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Sales <i class="soonDot">SOON</i></span></button></nav><script>const f=document.getElementById('adminFrame'),buttons=[...document.querySelectorAll('.navItem')];function adminSrc(){const ua=navigator.userAgent||'',touch=/Android|iPad|iPhone|Mobile|Tablet/i.test(ua)||((navigator.maxTouchPoints||0)>1&&/Macintosh/i.test(ua));return !touch&&Math.max(screen.width,screen.height)>=1000?'admin-desktop.html':'admin-core.html'}function go(page){if(page==='sales')return;buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='inventory'){f.src='inventory-mockup.html'}else{f.src=adminSrc()}}buttons.forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));go('orders');</script><script src="admin-delete-order.js"></script><script src="admin-review-images.js"></script></body></html>
