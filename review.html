<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review — TESTRA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#1746ff;--n:#0a1128;--p:#f7f7fb;--i:#12142b;--m:#6b7091;--l:#e4e5f1;--g:#ffb100}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--p);color:var(--i)}main{max-width:620px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:28px}h1{font-family:Georgia,serif}.muted{color:var(--m);line-height:1.6}.stars{display:flex;gap:8px;margin:18px 0}.stars button{font-size:34px;border:0;background:none;color:#d8d8df;cursor:pointer;padding:0}.stars button.on{color:var(--g)}input,textarea{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:120px}.photo{border:1px dashed #cfd4e8;border-radius:16px;padding:14px;margin:0 0 14px;background:#fafbff}.photo label{display:block;font-weight:800;margin-bottom:4px}.photo small{color:var(--m)}.photo input{border:0;padding:8px 0;margin:6px 0 0}.preview{display:none;width:100%;max-height:300px;object-fit:cover;border-radius:13px;margin-top:10px}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:var(--b);color:#fff;font-weight:800}.msg{margin-top:15px;font-size:13px}</style></head><body><main><div class="card"><b>TESTRA</b><h1>Kongsi pengalaman anda</h1><p class="muted">Terima kasih kerana memilih TESTRA. Ceritakan pengalaman anda supaya pelanggan lain boleh mengenali TESTRA dengan lebih baik.</p><div id="stars" class="stars"></div><input id="name" placeholder="Nama anda"><textarea id="comment" placeholder="Tulis review ringkas..."></textarea><div class="photo"><label for="photo">Tambah gambar <span style="font-weight:400">(pilihan)</span></label><small>JPG, PNG atau WebP · maksimum 5MB</small><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" alt="Preview gambar review"></div><button id="send" class="btn">Hantar Review</button><div id="msg" class="msg"></div></div></main><script>const sb=supabase.createClient('https://aytmfuevvoumobwfqptc.supabase.co','sb_publishable_Uol-itavAcZy4ciP3gbqJg_Ea9sw1TS'),q=new URLSearchParams(location.search),order=q.get('order'),nm=q.get('name')||'',S=document.getElementById('stars'),photo=document.getElementById('photo'),preview=document.getElementById('preview');name.value=nm;let rating=5;function draw(){S.innerHTML=[1,2,3,4,5].map(n=>`<button class="${n<=rating?'on':''}" data-n="${n}">★</button>`).join('')}draw();S.onclick=e=>{if(e.target.dataset.n){rating=+e.target.dataset.n;draw()}};photo.onchange=()=>{const f=photo.files[0];if(!f){preview.style.display='none';return}if(f.size>5242880){photo.value='';msg.textContent='Gambar mesti 5MB atau lebih kecil.';return}preview.src=URL.createObjectURL(f);preview.style.display='block'};send.onclick=async()=>{msg.textContent='';if(!name.value.trim())return msg.textContent='Sila masukkan nama.';if(!comment.value.trim())return msg.textContent='Sila tulis review.';send.disabled=true;send.textContent='Menghantar...';let image_url=null;const f=photo.files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),safe=(order||crypto.randomUUID()).replace(/[^a-zA-Z0-9_-]/g,'');const path=`${safe}/${Date.now()}.${ext}`;const up=await sb.storage.from('review-images').upload(path,f,{cacheControl:'3600',upsert:false});if(up.error){send.disabled=false;send.textContent='Hantar Review';msg.textContent='Gambar gagal dimuat naik. Cuba semula.';return}image_url=sb.storage.from('review-images').getPublicUrl(path).data.publicUrl}let {data:p}=await sb.from('products').select('id').eq('slug','testra-mens-wellness').limit(1);let {error}=await sb.from('reviews').insert({order_id:order||null,product_id:p?.[0]?.id||null,customer_name:name.value.trim(),rating,comment:comment.value.trim(),image_url,is_published:false});send.textContent='Hantar Review';if(error){send.disabled=false;msg.textContent=error.code==='23505'?'Review untuk pesanan ini sudah dihantar.':error.message;return}msg.textContent='Terima kasih! Review anda telah berjaya dihantar.';send.disabled=true}</script></body></html>
