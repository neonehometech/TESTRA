<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review — TESTRA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--b:#1746ff;--n:#0a1128;--p:#f7f7fb;--i:#12142b;--m:#6b7091;--l:#e4e5f1;--g:#ffb100}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--p);color:var(--i)}main{max-width:620px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:28px}h1{font-family:Georgia,serif}.muted{color:var(--m);line-height:1.6}.stars{display:flex;gap:8px;margin:18px 0}.stars button{font-size:34px;border:0;background:none;color:#d8d8df;cursor:pointer;padding:0}.stars button.on{color:var(--g)}input,textarea{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:120px}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:var(--b);color:#fff;font-weight:800}.msg{margin-top:15px;font-size:13px}</style></head><body><main><div class="card"><b>TESTRA</b><h1>Kongsi pengalaman anda</h1><p class="muted">Terima kasih kerana memilih TESTRA. Review anda akan disemak oleh admin sebelum dipaparkan di laman TESTRA.</p><div id="stars" class="stars"></div><input id="name" placeholder="Nama anda"><textarea id="comment" placeholder="Tulis review ringkas..."></textarea><button id="send" class="btn">Hantar Review</button><div id="msg" class="msg"></div></div></main>
<script>const sb=supabase.createClient('https://aytmfuevvoumobwfqptc.supabase.co','sb_publishable_Uol-itavAcZy4ciP3gbqJg_Ea9sw1TS'),q=new URLSearchParams(location.search),order=q.get('order'),nm=q.get('name')||'',S=document.getElementById('stars');name.value=nm;let rating=5;function draw(){S.innerHTML=[1,2,3,4,5].map(n=>`<button class="${n<=rating?'on':''}" data-n="${n}">★</button>`).join('')}draw();S.onclick=e=>{if(e.target.dataset.n){rating=+e.target.dataset.n;draw()}};send.onclick=async()=>{msg.textContent='';if(!name.value.trim())return msg.textContent='Sila masukkan nama.';if(!comment.value.trim())return msg.textContent='Sila tulis review.';send.disabled=true;let {data:p}=await sb.from('products').select('id').eq('slug','testra-mens-wellness').limit(1);let {error}=await sb.from('reviews').insert({order_id:order||null,product_id:p?.[0]?.id||null,customer_name:name.value.trim(),rating,comment:comment.value.trim(),is_published:false});send.disabled=false;if(error){msg.textContent=error.code==='23505'?'Review untuk pesanan ini sudah dihantar.':error.message;return}msg.textContent='Terima kasih! Review anda telah diterima dan sedang menunggu semakan admin.';send.disabled=true}</script></body></html>
