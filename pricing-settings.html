<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TESTRA Pricing & Packages</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071027;--b:#1746ff;--o:#ff6a00;--bg:#f3f5fb;--line:#e4e8f1;--m:#73798f;--g:#15945a;--r:#c63b33}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#12142b}.wrap{max-width:1180px;margin:auto;padding:22px 16px 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;color:var(--m);font-size:12px}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.btn.danger{color:var(--r)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pkg{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 26px #0710270b}.pkg.pop{border:2px solid var(--b)}.head{display:flex;justify-content:space-between;align-items:center}.tag{font-size:8px;font-weight:900;background:#eef2ff;color:var(--b);padding:5px 8px;border-radius:99px}.field{margin-top:12px}.field label{display:block;font-size:9px;font-weight:800;color:var(--m);margin:0 0 5px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit;font-size:12px;background:#fafbfe}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px}.check label{display:flex;align-items:center;gap:6px}.actions{display:flex;gap:7px;margin-top:12px}.summary{background:linear-gradient(120deg,#071027,#1735a8);color:#fff;border-radius:20px;padding:18px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;gap:14px}.summary small{opacity:.65}.summary b{display:block;font-size:17px;margin-bottom:3px}.auth{position:fixed;inset:0;z-index:50;background:#071027f2;display:grid;place-items:center;padding:20px}.authCard{width:min(420px,100%);background:#fff;border-radius:22px;padding:22px}.authCard h2{margin:0 0 6px}.authCard p{color:var(--m);font-size:12px}.authCard input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.status{font-size:11px;margin-top:10px;color:var(--m)}.topStatus{font-size:10px;color:var(--m);margin-bottom:12px}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.summary{align-items:start;flex-direction:column}}</style></head><body><div id="auth" class="auth"><div class="authCard"><h2>Admin Login</h2><p>Pricing write access hanya untuk akaun admin TESTRA.</p><input type="email" value="testraman.worldwide@gmail.com" readonly><button id="sendLink" class="btn">Hantar Magic Link</button><div id="authStatus" class="status"></div></div></div><main class="wrap"><div class="hero"><div><h1>Harga & Pakej</h1><p>Data di sini digunakan oleh landing page dan checkout.</p></div><button id="addPkg" class="btn">+ Tambah Pakej</button></div><div id="who" class="topStatus"></div><section id="grid" class="grid"></section><section class="summary"><div><b>Live Pricing Source</b><small>Simpan di sini → landing & checkout ikut data yang sama.</small></div><button id="reload" class="btn" style="background:#ff6a00">Reload Data</button></section></main><script>const U='https://aytmfuevvoumobwfqptc.supabase.co',K='sb_publishable_Uol-itavAcZy4ciP3gbqJg_Ea9sw1TS',ADMIN='testraman.worldwide@gmail.com';const sb=supabase.createClient(U,K);const grid=document.getElementById('grid'),auth=document.getElementById('auth'),who=document.getElementById('who'),authStatus=document.getElementById('authStatus');const rm=c=>c==null?'':(Number(c)/100).toFixed(2),cents=v=>Math.round(Number(v||0)*100);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(p){const a=document.createElement('article');a.className='pkg'+(p.is_popular?' pop':'');a.dataset.id=p.id||'';a.dataset.product=p.product_id||'';a.innerHTML=`<div class="head"><b>${esc(p.name||'Pakej Baru')}</b><span class="tag">${p.is_popular?'PALING POPULAR':p.is_active?'ACTIVE':'HIDDEN'}</span></div><div class="field"><label>NAMA PAKEJ</label><input data-k="name" value="${esc(p.name||'')}"></div><div class="two"><div class="field"><label>BILANGAN KOTAK</label><input data-k="bottle_qty" type="number" min="1" value="${p.bottle_qty||1}"></div><div class="field"><label>SLUG</label><input data-k="slug" value="${esc(p.slug||'')}"></div></div><div class="two"><div class="field"><label>HARGA JUALAN (RM)</label><input data-k="price_cents" type="number" step="0.01" value="${rm(p.price_cents)}"></div><div class="field"><label>HARGA ASAL (RM)</label><input data-k="compare_at_cents" type="number" step="0.01" value="${rm(p.compare_at_cents)}"></div></div><div class="field"><label>CAPTION</label><input data-k="caption" value="${esc(p.caption||'')}"></div><div class="check"><label><input data-k="is_active" type="checkbox" ${p.is_active?'checked':''}> Aktif</label><label><input data-k="is_popular" type="checkbox" ${p.is_popular?'checked':''}> Paling Popular</label></div><div class="actions"><button class="btn save">Simpan</button><button class="btn alt danger del">Delete</button></div>`;a.querySelector('.save').onclick=()=>save(a);a.querySelector('.del').onclick=()=>del(a);return a}async function load(){const {data,error}=await sb.from('packages').select('*').order('sort_order');if(error){alert(error.message);return}grid.innerHTML='';(data||[]).forEach(p=>grid.appendChild(card(p)))}function readCard(a){const o={};a.querySelectorAll('[data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.k==='bottle_qty')v=Number(v||1);if(['price_cents','compare_at_cents'].includes(el.dataset.k))v=v===''?null:cents(v);o[el.dataset.k]=v});o.updated_at=new Date().toISOString();return o}async function save(a){const id=a.dataset.id,o=readCard(a);if(o.is_popular){await sb.from('packages').update({is_popular:false}).neq('id',id||'00000000-0000-0000-0000-000000000000')}let q=id?sb.from('packages').update(o).eq('id',id).select().single():sb.from('packages').insert({...o,product_id:a.dataset.product||null,currency:'MYR',sort_order:99}).select().single();const {data,error}=await q;if(error){alert('Save gagal: '+error.message);return}if(data?.id)a.dataset.id=data.id;alert('Pricing saved live.');load()}async function del(a){const id=a.dataset.id;if(!id){a.remove();return}if(!confirm('Delete package ini?'))return;const {error}=await sb.from('packages').delete().eq('id',id);if(error){alert('Delete gagal: '+error.message);return}load()}document.getElementById('addPkg').onclick=()=>grid.appendChild(card({name:'Pakej Baru',bottle_qty:1,price_cents:0,compare_at_cents:null,caption:'',is_active:false,is_popular:false,slug:'testra-'+Date.now(),product_id:null}));document.getElementById('reload').onclick=load;document.getElementById('sendLink').onclick=async()=>{authStatus.textContent='Menghantar...';const {error}=await sb.auth.signInWithOtp({email:ADMIN,options:{emailRedirectTo:location.href}});authStatus.textContent=error?error.message:'Magic link dihantar. Check email TESTRA.'};async function init(){const {data:{session}}=await sb.auth.getSession();if(session?.user?.email===ADMIN){auth.classList.add('hidden');who.textContent='Signed in: '+ADMIN;load()}else auth.classList.remove('hidden')}sb.auth.onAuthStateChange(()=>init());init();</script></body></html>
